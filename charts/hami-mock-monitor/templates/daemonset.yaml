apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hami-mock-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hami-mock-monitor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hami-mock-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hami-mock-monitor.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hami-mock-monitor.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: {{ include "hami-mock-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:9394
            - --load-source={{ .Values.loadSource }}
            {{- if .Values.legacyMetrics }}
            - --legacy-metrics
            {{- end }}
            {{- if .Values.countAllocating }}
            - --count-allocating
            {{- end }}
            {{- if .Values.completeBinds }}
            - --complete-binds
            {{- end }}
            {{- if .Values.smi.inject.enabled }}
            - --webhook-bind-address=:{{ .Values.smi.inject.port }}
            - --webhook-cert-dir=/tls
            - --smi-image={{ include "hami-mock-monitor.image" . }}
            - --smi-url=http://{{ include "hami-mock-monitor.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
            - --smi-resources={{ join "," .Values.smi.inject.resourceNames }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9394
            {{- if .Values.smi.inject.enabled }}
            - name: webhook
              containerPort: {{ .Values.smi.inject.port }}
          volumeMounts:
            - name: webhook-tls
              mountPath: /tls
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.smi.inject.enabled }}
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "hami-mock-monitor.fullname" . }}-webhook-tls
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
