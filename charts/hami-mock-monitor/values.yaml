image:
  repository: ghcr.io/fishing-agents/hami-mock-monitor
  # Defaults to the chart's appVersion.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Default load source for pods without a hami-mock-monitor.io/load-source
# annotation: vllm, seed or static.
loadSource: seed
# Emit HAMi's legacy CamelCase metric names alongside the hami_* ones.
legacyMetrics: false
# Count pods whose hami.io/bind-phase is still allocating. Needed with an
# unpatched mock device plugin unless completeBinds is on.
countAllocating: false
# Mark this node's pods still at hami.io/bind-phase=allocating success and
# release the node lock that names one of them, as the real device plugin
# does. A workaround for the mock device plugin; grants patch on pods and nodes.
completeBinds: false
# Further flags, e.g. ["--seed=42", "--vllm-max-num-seqs=8"]; see --help.
extraArgs: []

service:
  port: 9394

serviceMonitor:
  enabled: false
  interval: 15s
  # Keep the series' own namespace, pod and container labels (as HAMi's
  # vGPUmonitor sets them) instead of renaming them exported_*.
  honorLabels: true
  labels: {}

smi:
  inject:
    # Put the mock nvidia-smi into the containers of pods HAMi allocates
    # devices to, with a mutating webhook (failurePolicy Ignore) the monitor
    # serves. Containers ask the monitor of their node through the Service.
    enabled: false
    # Namespaces whose new pods are considered.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
    # A limit on one of these marks a new pod as HAMi-allocated (HAMi writes
    # hami.io/vgpu-devices-allocated only when scheduling, after admission);
    # pods created with that annotation count as well.
    resourceNames:
      - nvidia.com/gpu
      - nvidia.com/gpumem
      - nvidia.com/gpucores
      - nvidia.com/gpumem-percentage
    port: 9443
    # Have cert-manager issue the webhook certificate instead of a CA the
    # chart generates once and keeps across upgrades.
    certManager:
      enabled: false

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
podAnnotations: {}
